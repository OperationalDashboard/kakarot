<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kakarot">
<link rel="manifest" href="/static/manifest.json">
<title>Kakarot</title>
<style>
  :root{--bg:#f6f7f5;--panel:#ffffff;--ink:#1d2320;--muted:#6b746f;--line:#e3e6e2;--accent:#1f7a5a;--accent-ink:#fff;--me:#e6f2ec;--warn:#b5462f;--code:#f1f3f0}
  @media (prefers-color-scheme: dark){:root{--bg:#121513;--panel:#1a1e1c;--ink:#e6ebe8;--muted:#8d9791;--line:#2b312e;--accent:#3fb886;--accent-ink:#06140e;--me:#1f3329;--warn:#ff8a70;--code:#222826}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;height:100dvh;display:flex}
  aside{width:320px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
  h1{font-size:17px;margin:0}
  #status{font-size:12px;color:var(--muted);margin-left:auto}
  #status.bad{color:var(--warn)}
  .tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;background:none;border:0;padding:10px 9px;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-color:var(--accent)}
  .badge{background:var(--warn);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px}
  #side{overflow:auto;padding:12px;flex:1}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;background:var(--bg)}
  .card b{display:block;margin-bottom:2px}
  .card small{color:var(--muted)}
  .card .x{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
  .card pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:inherit}
  .done{opacity:.5;text-decoration:line-through}
  .conv{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:4px;border:1px solid transparent}
  .conv:hover{background:var(--bg)}
  .conv.on{background:var(--me);border-color:var(--line)}
  .conv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv small{color:var(--muted);display:block;font-size:11px}
  .conv .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;visibility:hidden}
  .conv:hover .x,.conv.on .x{visibility:visible}
  .newc{width:100%;margin-bottom:10px;padding:9px;border:1px dashed var(--line);background:none;color:var(--ink);border-radius:10px;cursor:pointer;font:inherit;font-size:13px}
  #chat{flex:1;overflow:auto;padding:20px}
  .msg{max-width:780px;margin:0 auto 14px;display:flex}
  .msg .b{padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;max-width:100%}
  .msg.user{justify-content:flex-end}.msg.user .b{background:var(--me)}
  .msg.assistant .b{background:var(--panel);border:1px solid var(--line)}
  .msg.err .b{color:var(--warn);border:1px solid var(--warn);background:var(--panel)}
  details{max-width:780px;margin:-6px auto 14px;font-size:12px;color:var(--muted)}
  details pre{background:var(--code);padding:8px;border-radius:8px;white-space:pre-wrap;max-height:220px;overflow:auto}
  .empty{max-width:560px;margin:8vh auto;text-align:center;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
  form{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);height:46px;max-height:160px}
  form button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.5}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
  .thinking{color:var(--muted);font-style:italic}
  #smart{background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  #smart.on{background:#6b4fd8;color:#fff;border-color:#6b4fd8}
  .approve{max-width:780px;margin:0 auto 14px;border:2px solid #d9a21b;background:var(--panel);border-radius:14px;padding:12px 14px}
  .approve b{display:block;margin-bottom:4px}
  .approve code{display:block;background:var(--code);padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;margin:6px 0;font-size:13px}
  .approve small{color:var(--muted)}
  .approve .row{display:flex;gap:8px;margin-top:8px}
  .approve button{border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
  .approve .yes{background:var(--accent);color:var(--accent-ink)} .approve .no{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  #attach{background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;cursor:pointer}
  #files{display:none;flex-wrap:wrap;gap:6px;padding:8px 18px 0;background:var(--panel);border-top:1px solid var(--line)}
  #files.on{display:flex} #files.on + form{border-top:0}
  .chip{background:var(--me);border-radius:14px;padding:3px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
  .chip button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0}
  .live{max-width:780px;margin:-6px auto 14px;font-size:12.5px;color:var(--muted)}
  .live div{padding:2px 0} .live .ok{color:var(--accent)} .live .bad{color:var(--warn)}
  .live .think{font-style:italic;opacity:.8;white-space:pre-wrap;max-height:4.5em;overflow:hidden}
  .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
  .bar i{display:block;height:100%;background:var(--accent)}
  .sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
  .sec:first-child{margin-top:0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}
  .dot.up{background:#2fb36b} .dot.down{background:var(--warn)}
  .mini{display:flex;gap:6px;margin-top:6px} .mini input,.mini textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink)}
  .mini textarea{height:64px;resize:vertical}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .card ol{margin:6px 0 0;padding-left:18px} .card li.d{color:var(--accent)}
  .pill{display:inline-block;border-radius:10px;padding:0 7px;font-size:11.5px;font-weight:700;color:#fff;background:var(--muted);vertical-align:1px}
  .pill.g{background:#2f9e5f}.pill.y{background:#c99a12}.pill.r{background:var(--warn)}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 6px;font-size:11px;color:var(--muted);margin-right:4px}
  .wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .wrap .btn,.wrap .ghost{font-size:12.5px;padding:5px 10px;text-decoration:none}
  select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink);min-width:0}
  #modal{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:18px}
  #modal.on{display:flex}
  #modal .box{background:var(--panel);color:var(--ink);border-radius:14px;width:min(860px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  #modal h2{margin:0 0 2px;font-size:19px} #modal h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
  #modal .top{display:flex;gap:10px;align-items:flex-start} #modal .top .x{margin-left:auto;font-size:20px;background:none;border:0;color:var(--muted);cursor:pointer}
  .scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 14px;font-size:12.5px}
  .scores div span{float:right;color:var(--muted)}
  .iss{border-top:1px solid var(--line);padding:7px 0;font-size:13px} .iss:first-child{border-top:0}
  .iss small{display:block;color:var(--muted)} .iss code{font-size:12px;background:var(--code);padding:0 4px;border-radius:4px}
  .shots{display:flex;gap:10px;margin-top:6px} .shots img{max-height:170px;border:1px solid var(--line);border-radius:8px;max-width:70%}
  .hist{font-size:13px;border-top:1px solid var(--line);padding:6px 0;display:flex;gap:8px;align-items:flex-start}
  .hist div{flex:1;min-width:0} .hist small{color:var(--muted);display:block}
  pre.diff{background:var(--code);padding:8px;border-radius:8px;max-height:320px;overflow:auto;font-size:12px;white-space:pre}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px} .form input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink);min-width:0}
  .form label{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center} .form .full{grid-column:1/-1}
  .msgline{font-size:12.5px;margin-top:6px;white-space:pre-wrap}
  @media (max-width:800px){ #modal{padding:0} #modal .box{border-radius:0;height:100%} .form{grid-template-columns:1fr} }
  #menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer}
  #shade{display:none}
  @media (max-width:800px){
    #menu{display:inline-block}
    aside{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
    body.open aside{transform:none}
    body.open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
    #chat{padding:12px}
    .msg .b{max-width:88%}
    form{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
    textarea{font-size:16px}
    #status{display:none}
    header{padding:10px 12px}
  }
</style>
</head>
<body>
<aside>
  <header><div class="logo">K</div><h1 id="name">Kakarot</h1></header>
  <div class="tabs">
    <button data-t="chats" class="on">Chats</button>
    <button data-t="inbox">Inbox<span id="badge"></span></button>
    <button data-t="missions">Missions</button>
    <button data-t="websites">Websites<span id="badge4"></span></button>
    <button data-t="jobs">Scheduled</button>
    <button data-t="notes">Notes</button>
    <button data-t="memory">Memory</button>
    <button data-t="status">Status<span id="badge3"></span></button>
  </div>
  <div id="side"></div>
</aside>
<div id="modal"><div class="box" id="mbox"></div></div>
<main>
  <div id="shade"></div>
  <header><button id="menu" title="Chats, inbox, schedules, notes">☰<span id="badge2"></span></button><span id="title">Chat</span><span id="status">checking…</span><button class="ghost" id="clear">New chat</button></header>
  <div id="chat"></div>
  <div id="files"></div>
  <form id="f"><input type="file" id="pick" multiple hidden accept="image/*,.pdf,.docx,.xlsx,.xlsm,.csv,.txt,.md"><button type="button" id="attach" title="Attach a photo or file">📎</button><button type="button" id="smart" title="Smart mode: bigger brain for hard tasks (slower)">🧠 Smart</button><textarea id="t" placeholder="Tell Kakarot what to do…  (Enter to send, Shift+Enter for new line)"></textarea><button id="send">Send</button></form>
</main>
<script>
const $ = s => document.querySelector(s);
const linkify = h => h.replace(/(https?:\/\/[^\s<"']+[^\s<"'.,;:)])|(\/(?:sites|apps)\/[\w.-]+\/)/g, m => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (u, o={}) => { const r = await fetch(u, {headers:{"Content-Type":"application/json"}, ...o}); if(r.status === 401){ location.href = "/login"; throw new Error("locked"); } return r.json(); };
let tab = "chats", lastInbox = null, conv = null;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} } };

const EXAMPLES = [
  "Dhaka to Noakhali tomorrow - which trips are there?",
  "Make an Excel sheet of my monthly expenses with a total row",
  "Open lalsobujbus.com, search Dhaka to Sylhet and tell me the times",
  "Write a Word letter to my bank asking for a statement",
  "Remind me in 30 minutes to call the office",
  "Show my PC's IP address",
  "What do my files say about the bus rent agreement?",
  "Is lalsobujdata.site up right now?",
  "Write a Python program that reads my sales Excel and makes a monthly chart, and test it",
  "Build yourself a tool to convert BDT to USD with today's rate",
  "I want a modern website for my restaurant with menu, gallery, table booking and contact page",
  "Open my website lalsobujdata.site, check it and fix every problem you find",
  "Check github.com/kakarotshi0-commits/greenwonderland and publish the fixes back to GitHub"
];

function addMsg(role, text){
  $("#chat").querySelector(".empty")?.remove();
  const d = document.createElement("div"); d.className = "msg " + role;
  if(role === "user") text = String(text).replace(/\n*\[Attached file: [^\]]*?([^\\/\]]+)\]/g, "\n📎 $1").trim();
  d.innerHTML = `<div class="b">${linkify(esc(text))}</div>`; $("#chat").append(d);
  $("#chat").scrollTop = 1e9; return d;
}
function addSteps(steps){
  if(!steps?.length) return;
  const d = document.createElement("details");
  d.innerHTML = `<summary>${steps.length} action${steps.length>1?"s":""}: ${esc(steps.map(s=>s.tool).join(", "))}</summary>` +
    steps.map(s=>`<pre><b>${esc(s.tool)}</b> ${esc(JSON.stringify(s.args))}\n→ ${esc(s.result)}</pre>`).join("");
  $("#chat").append(d);
}
function showEmpty(){
  $("#chat").innerHTML = `<div class="empty"><h2>What should I do?</h2>I run fully on this PC. I can use websites, make Excel/Word/PDF files, read photos 📎, search inside your documents, write and test real programs, build websites and check / fix / publish your existing ones, learn something new every night, run big jobs as background Missions, watch your website and run PC commands with your OK. Turn on 🧠 Smart for hard jobs.<div class="chips">${EXAMPLES.map(e=>`<button>${esc(e)}</button>`).join("")}</div></div>`;
  $("#chat").querySelectorAll(".chips button").forEach(b => b.onclick = () => { $("#t").value = b.textContent; $("#t").focus(); });
}

const LABEL = {web_open:"Opening website", web_click:"Clicking", web_type:"Typing", web_select:"Choosing an option", web_read:"Reading the page", web_scroll:"Scrolling", web_screenshot:"Taking a screenshot", web_search:"Searching the web", fetch_page:"Reading a page", browse_page:"Opening a page", look_at_image:"Looking at the picture", search_my_files:"Searching your files", index_my_files:"Indexing your files", read_file:"Reading a file", write_file:"Writing a file", create_excel:"Making an Excel file", create_word:"Making a Word file", create_pdf:"Making a PDF", run_command:"Asking to run a command", open_file:"Asking to open a file", lalsobuj_trip_report:"Checking every Lal Sobuj route (about 3 min)", lalsobuj_route_trips:"Checking the route", lalsobuj_morning_brief:"Making the morning brief (about 3 min)", start_mission:"Starting a mission", build_website:"Starting the website builder", update_website:"Starting the website update", check_website:"Starting the website check", website_status:"Checking your websites", open_website:"Opening the website", fix_website:"Starting the fixes", publish_website:"Preparing to publish", undo_website:"Undoing", website_history:"Reading the history", refresh_website:"Getting the latest version", list_websites:"Listing websites", publishing_accounts:"Checking accounts", set_reminder:"Setting a reminder", schedule_task:"Scheduling", remember:"Remembering"};
const stepText = (tool, args) => { const a = args?.url || args?.path || args?.query || args?.question || args?.goal || args?.text || ""; return (LABEL[tool] || tool) + (a ? ": " + String(a).slice(0, 70) : ""); };
let attached = [];
function paintFiles(){
  $("#files").classList.toggle("on", attached.length > 0);
  $("#files").innerHTML = attached.map((f, i) => `<span class="chip">📎 ${esc(f.name)}<button data-i="${i}" title="Remove">✕</button></span>`).join("");
  $("#files").querySelectorAll("button").forEach(b => b.onclick = () => { attached.splice(+b.dataset.i, 1); paintFiles(); });
}
$("#attach").onclick = () => $("#pick").click();
$("#pick").onchange = () => { attached.push(...$("#pick").files); $("#pick").value = ""; paintFiles(); $("#t").focus(); };

async function send(e){
  e?.preventDefault();
  if($("#send").disabled) return;
  let text = $("#t").value.trim(); if(!text && !attached.length) return;
  const files = attached.splice(0); paintFiles();
  if(!text) text = files.length > 1 ? "Look at the attached files and tell me what's in them." : "Look at the attached file and tell me what's in it.";
  $("#t").value = ""; addMsg("user", text + (files.length ? "\n📎 " + files.map(f => f.name).join(", ") : ""));
  const wait = addMsg("assistant", files.length ? "Uploading…" : "Working on it…"); const bub = wait.querySelector(".b"); bub.classList.add("thinking");
  const live = document.createElement("div"); live.className = "live"; $("#chat").append(live);
  $("#send").disabled = true;
  const ap = setInterval(checkApprovals, 1500);
  let msg = text, got = false, words = "";
  try{
    if(files.length){
      const fd = new FormData(); files.forEach(f => fd.append("files", f, f.name));
      const up = await fetch("/api/upload", {method:"POST", body:fd});
      if(up.status === 401){ location.href = "/login"; return; }
      const saved = await up.json();
      msg += "\n\n" + saved.map(f => `[Attached file: ${f.path}]`).join("\n");
      bub.textContent = "Working on it…";
    }
    const res = await fetch("/api/chat/stream", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:msg, conversation_id:conv, smart:smart})});
    if(res.status === 401){ location.href = "/login"; return; }
    if(!res.ok){ got = true; live.remove(); wait.remove(); addMsg("err", res.status === 404 ? "Kakarot is switching to its new version. Wait 30 seconds, refresh this page and send again." : "Kakarot hit a problem (" + res.status + "). Try again in a moment."); return; }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", lastLine = null, thinkEl = null;
    const handle = ev => {
      if(ev.type === "start"){ conv = ev.conversation_id; store.set("kakarot_conv", conv); }
      else if(ev.type === "status"){ bub.textContent = ev.text; }
      else if(ev.type === "thinking_start"){ words = ""; }
      else if(ev.type === "thinking"){ if(!thinkEl){ thinkEl = document.createElement("div"); thinkEl.className = "think"; live.prepend(thinkEl); } thinkEl.textContent = ("💭 " + (thinkEl.textContent.slice(2) + ev.text)).slice(-260); }
      else if(ev.type === "token"){ words += ev.text; bub.classList.remove("thinking"); bub.textContent = words; $("#chat").scrollTop = 1e9; }
      else if(ev.type === "step_start"){ words = ""; bub.classList.add("thinking"); bub.textContent = "Working on it…"; lastLine = document.createElement("div"); lastLine.textContent = "⏳ " + stepText(ev.tool, ev.args); live.append(lastLine); $("#chat").scrollTop = 1e9; }
      else if(ev.type === "step_done"){ if(lastLine){ lastLine.textContent = lastLine.textContent.replace("⏳", ev.ok ? "✓" : "✗"); lastLine.className = ev.ok ? "ok" : "bad"; } }
      else if(ev.type === "done"){ got = true; live.remove(); bub.classList.remove("thinking"); bub.innerHTML = linkify(esc(ev.reply)); addSteps(ev.steps); }
      else if(ev.type === "error"){ got = true; live.remove(); wait.remove(); addMsg("err", ev.error + (ev.hint ? "\n\n" + ev.hint : "")); }
    };
    while(true){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i; while((i = buf.indexOf("\n\n")) >= 0){
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        for(const line of block.split("\n")) if(line.startsWith("data: ")){ try{ handle(JSON.parse(line.slice(6))); }catch(x){} }
      }
    }
    if(!got) throw new Error("cut");
  }catch(err){
    live.remove();
    if(!got){ bub.classList.remove("thinking"); bub.textContent = "The connection dropped, but Kakarot keeps working and saves the answer. Open this chat again in a minute to see it."; wait.className = "msg err"; }
  }
  clearInterval(ap); document.querySelectorAll(".approve").forEach(e => { if(!e.querySelector("b")?.textContent.startsWith("🚀")) e.remove(); });
  $("#send").disabled = false; renderSide(); if(window.innerWidth > 800) $("#t").focus();
}
$("#f").onsubmit = send;
let smart = store.get("kakarot_smart") === "1";
function paintSmart(){ $("#smart").classList.toggle("on", smart); }
$("#smart").onclick = () => { smart = !smart; store.set("kakarot_smart", smart ? "1" : null); paintSmart(); };
paintSmart();
function publishCard(t, reason){
  const files = t.files || [];
  return `<b>🚀 ${t.undo ? "Undo the publish of" : "Publish"} ${esc(t.title || t.name)}?</b><small>${esc(reason || "")}</small><code>To: ${esc(t.dest)}\n${t.undo ? "Puts the earlier version back" : `${t.count} changed file(s)${t.total ? " of " + t.total : ""}`}${files.length ? ":\n" + files.slice(0, 15).map(f => "• " + f).join("\n") + (files.length > 15 ? `\n…and ${files.length - 15} more` : "") : ""}</code>${(t.warnings || []).map(w => `<small>⚠️ ${esc(w)}</small><br>`).join("")}<small>Server files are backed up first; you can undo it later.</small><div class="row"><button class="yes">Approve</button><button class="no">Deny</button></div>`;
}
async function checkApprovals(onlyPublish){
  let list; try{ list = await api("/api/approvals"); }catch(e){ return; }
  if(onlyPublish) list = list.filter(a => a.kind === "publish");
  for(const a of list){
    if(document.getElementById("ap" + a.id)) continue;
    const d = document.createElement("div"); d.className = "approve"; d.id = "ap" + a.id;
    if(a.kind === "publish"){ const t = JSON.parse(a.detail); d.innerHTML = publishCard(t, a.reason); }
    else if(a.kind === "tool"){ const t = JSON.parse(a.detail); d.innerHTML = `<b>🧩 Kakarot built a new ability: ${esc(t.name)}</b><small>${esc(a.reason)}</small><details><summary>Show the code</summary><code>${esc(t.code)}</code></details><div class="row"><button class="yes">Approve</button><button class="no">Deny</button></div>`; }
    else d.innerHTML = `<b>⚠️ Kakarot wants to ${a.kind === "open" ? "open this file" : "run this command"} on your PC</b><code>${esc(a.detail)}</code><small>Why: ${esc(a.reason)}</small><div class="row"><button class="yes">Approve</button><button class="no">Deny</button></div>`;
    const answer = async ok => { d.querySelectorAll("button").forEach(b => b.disabled = true); await api("/api/approvals/" + a.id, {method:"POST", body:JSON.stringify({approve: ok})}); d.remove(); if(a.kind === "publish" && ok) addMsg("assistant", "🚀 Publishing started - follow it in the Websites tab. The result arrives in your Inbox."); if(tab === "websites") renderSide(); };
    d.querySelector(".yes").onclick = () => answer(true);
    d.querySelector(".no").onclick = () => answer(false);
    $("#chat").append(d); $("#chat").scrollTop = 1e9;
  }
  if(!onlyPublish) document.querySelectorAll(".approve").forEach(e => { if(!list.some(a => "ap" + a.id === e.id)) e.remove(); });
}
$("#t").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ send(e); } });
$("#menu").onclick = () => document.body.classList.add("open");
$("#shade").onclick = () => document.body.classList.remove("open");
$("#clear").onclick = () => newChat();

function newChat(){
  conv = null; store.set("kakarot_conv", null); showEmpty(); $("#title").textContent = "New chat";
  document.body.classList.remove("open"); if(tab === "chats") renderSide();
}
async function openChat(id){
  const msgs = await api("/api/conversations/" + id).catch(() => null);
  if(!msgs || msgs.error){ newChat(); return; }
  conv = id; store.set("kakarot_conv", id);
  $("#chat").innerHTML = "";
  if(!msgs.length) showEmpty();
  msgs.forEach(m => { addMsg(m.role === "error" ? "err" : m.role, m.content); if(m.role === "assistant") addSteps(m.steps); });
  document.body.classList.remove("open"); if(tab === "chats") renderSide();
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); tab = b.dataset.t; renderSide();
});

async function renderSide(){
  const s = $("#side");
  if(tab === "chats"){
    const cs = await api("/api/conversations");
    const cur = cs.find(c => c.id == conv); $("#title").textContent = cur ? cur.title : "New chat";
    s.innerHTML = `<button class="newc">＋ New chat</button>` + (cs.map(c => `<div class="conv ${c.id==conv?"on":""}" data-id="${c.id}"><div class="t">${esc(c.title)}<small>${esc(c.updated)} · ${c.count} messages</small></div><button class="x" title="Delete chat">✕</button></div>`).join("") || `<small>Your chats are saved here.</small>`);
    s.querySelector(".newc").onclick = newChat;
    s.querySelectorAll(".conv").forEach(d => {
      d.onclick = () => openChat(+d.dataset.id);
      d.querySelector(".x").onclick = async ev => { ev.stopPropagation(); if(!confirm("Delete this chat?")) return; await api("/api/conversations/" + d.dataset.id, {method:"DELETE"}); if(d.dataset.id == conv) newChat(); else renderSide(); };
    });
  } else if(tab === "inbox"){
    const items = await api("/api/inbox");
    s.innerHTML = items.map(i => `<div class="card"><b>${esc(i.title)}</b><small>${esc(i.created)}</small><pre>${esc(i.body)}</pre></div>`).join("") || `<small>Reminders and results of scheduled tasks appear here.</small>`;
    if(items.some(i => !i.seen)) await api("/api/inbox/seen", {method:"POST"});
    $("#badge").innerHTML = "";
  } else if(tab === "jobs"){
    const jobs = await api("/api/jobs");
    s.innerHTML = jobs.map(j => `<div class="card"><button class="x" data-id="${esc(j.id)}" title="Cancel">✕</button><b>${j.kind==="reminder"?"⏰":"🔁"} ${esc(j.name)}</b><small>${esc(j.schedule)} · next: ${esc(j.next_run)}</small>${j.task?`<pre>${esc(j.task)}</pre>`:""}</div>`).join("") || `<small>Nothing scheduled. Try “every day at 9am check …”.</small>`;
    s.querySelectorAll(".x").forEach(b => b.onclick = async () => { await api("/api/jobs/" + b.dataset.id, {method:"DELETE"}); renderSide(); });
  } else if(tab === "notes"){
    const notes = await api("/api/notes");
    s.innerHTML = notes.map(n => `<div class="card ${n.done?"done":""}" data-id="${n.id}" style="cursor:pointer">${esc(n.text)}<br><small>#${n.id} · ${esc(n.created)}</small></div>`).join("") || `<small>No notes yet. Click a note to tick it off.</small>`;
    s.querySelectorAll(".card").forEach(c => c.onclick = async () => { await api(`/api/notes/${c.dataset.id}/toggle`, {method:"POST"}); renderSide(); });
  } else if(tab === "missions"){
    const [ms, webs] = await Promise.all([api("/api/missions"), api("/api/websites")]);
    const icon = {queued:"⏳", running:"⚙️", done:"✅", failed:"❌", cancelled:"⛔"};
    const keep = s.querySelector("#goal")?.value || "";
    s.innerHTML = `<div class="card"><b>New mission</b><small>A big job Kakarot plans and does on its own in the background. The result goes to your Inbox.</small><div class="mini"><textarea id="goal" placeholder="e.g. A modern website for my bus company with routes, fares, online booking and an admin page. Green and white, English and Bangla."></textarea></div><div class="mini"><button class="btn" id="web">🌐 Build website</button><button class="ghost" id="go">Start mission</button></div></div>` +
      (webs.length ? `<div class="sec">Your websites</div>` + webs.map(w => `<div class="card"><b>🌐 ${esc(w.title)}</b><small>${esc(w.type === "flask" ? "web app" : "website")} · ${esc(w.name)}</small><div class="mini"><a class="btn" href="${esc(w.link)}" target="_blank" style="text-decoration:none">Open</a></div></div>`).join("") + `<div class="sec">Missions</div>` : "") +
      (ms.map(m => { const n = m.plan.length, d = m.done_steps, pct = n ? Math.round(100 * d / n) : (m.status === "done" ? 100 : 3);
        return `<div class="card">${["queued","running"].includes(m.status) ? `<button class="x" data-id="${m.id}" title="Cancel">✕</button>` : ""}<b>${icon[m.status] || ""} ${esc(m.goal)}</b><small>#${m.id} · ${esc(m.status)} · ${n ? `step ${Math.min(d + (m.status === "running" ? 1 : 0), n)} of ${n}` : "planning…"} · ${esc(m.updated)}</small>${m.status !== "done" ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}${n ? `<details><summary>Plan & step results</summary><ol>${m.plan.map((p, i) => `<li class="${i < d ? "d" : ""}">${esc(p)}${m.log[i] ? `<pre>${esc(m.log[i].result.slice(0, 700))}</pre>` : ""}</li>`).join("")}</ol></details>` : ""}${m.result ? `<pre>${linkify(esc(m.result))}</pre>` : ""}</div>`; }).join("") || `<small>No missions yet.</small>`);
    $("#goal").value = keep;
    $("#web").onclick = async () => { const g = $("#goal").value.trim(); if(!g) { $("#goal").focus(); return; } $("#goal").value = ""; await api("/api/websites", {method:"POST", body:JSON.stringify({request:g})}); renderSide(); };
    $("#go").onclick = async () => { const g = $("#goal").value.trim(); if(!g) return; $("#goal").value = ""; await api("/api/missions", {method:"POST", body:JSON.stringify({goal:g})}); renderSide(); };
    s.querySelectorAll(".x").forEach(b => b.onclick = async () => { if(!confirm("Cancel this mission?")) return; await api(`/api/missions/${b.dataset.id}/cancel`, {method:"POST"}); renderSide(); });
  } else if(tab === "websites"){
    await renderWebsites(s);
  } else if(tab === "status"){
    const [st, su] = await Promise.all([api("/api/system"), api("/api/selfupdate")]);
    const f = st.files, b = st.brief, v = su.version || {}, lc = su.last_check || {}, tl = su.tools;
    s.innerHTML = `<div class="sec">Brains</div>` + st.models.map(m => `<div class="card"><span class="dot ${m.ready ? "up" : "down"}"></span><b style="display:inline">${esc(m.role)}</b> <small>${esc(m.name)}${m.ready ? "" : " · not downloaded: run " + esc(m.script)}</small></div>`).join("") +
      `<div class="sec">Websites watched</div>` + (st.sites.map(x => `<div class="card"><button class="x" data-url="${esc(x.url)}" title="Stop watching">✕</button><b><span class="dot ${x.ok == null ? "" : x.ok ? "up" : "down"}"></span>${esc(x.url)}</b><small>${x.ok == null ? "not checked yet" : x.ok ? `Up since ${esc(x.since)}` : `DOWN: ${esc(x.error)} (since ${esc(x.since)})`}${x.ms != null ? ` · ${x.ms} ms` : ""}${x.uptime24 != null ? ` · 24h uptime ${x.uptime24}%` : ""}${x.cert_days != null ? ` · certificate ${x.cert_days} days left` : ""}</small></div>`).join("") || `<small>No websites watched yet.</small>`) +
      `<div class="mini"><input id="site" placeholder="https://your-site.com"><button class="btn" id="addsite">Watch</button></div><div class="mini"><button class="ghost" id="checksites">Check now</button><small style="align-self:center">next auto check: ${esc(st.next["sys-watch"] || "-")}</small></div>` +
      `<div class="sec">Your files</div><div class="card"><b>${f.files} files · ${f.chunks} passages indexed</b><small>${f.with_meaning ? `meaning search on (${f.with_meaning} passages)` : "keyword search only"} · last: ${esc(f.last || "never")}${f.running ? " · indexing now…" : ""}</small>${f.note ? `<pre>${esc(f.note)}</pre>` : ""}<div class="mini"><button class="ghost" id="reindex">Re-index now</button></div></div>` +
      `<div class="sec">Self-improvement</div><div class="card"><b>Version ${esc((v.sha || "").slice(0,7) || "not recorded yet")}</b><small>${esc(v.message || "")}${v.installed ? " · installed " + esc(v.installed) : ""}<br>Auto-install new versions: ${su.settings.auto_update_code ? "on" : "off"} · last check: ${esc(lc.at || "never")} · next: ${esc(su.next["sys-update"] || "-")}</small><div class="mini"><button class="ghost" id="upd">Check for update</button></div></div>` +
      `<div class="card"><b>Nightly learning</b><small>last: ${esc(su.last_learn || "never")} · next: ${esc(su.next["sys-learn"] || "-")} · brains refresh: ${esc(su.next["sys-models"] || "-")}</small>${su.last_learn_report ? `<details><summary>Last report</summary><pre>${esc(su.last_learn_report)}</pre></details>` : ""}<div class="mini"><button class="ghost" id="learn">Learn now</button></div></div>` +
      `<div class="card"><b>Lessons I follow (${su.lessons.length})</b>${su.lessons.map(l => `<div style="display:flex;gap:6px;margin-top:4px"><span style="flex:1">• ${esc(l.text)}</span><button class="x lesson" data-id="${l.id}" title="Forget this lesson">✕</button></div>`).join("") || "<small><br>None yet - I learn them every night.</small>"}</div>` +
      `<div class="sec">New abilities</div>` + tl.pending.map(t => `<div class="card" style="border:2px solid #d9a21b"><b>🧩 ${esc(t.name)} - waiting for your OK</b><small>${esc(t.description)}</small><details><summary>Show the code</summary><pre>${esc(t.code)}</pre></details><div class="mini"><button class="btn tok" data-id="${t.id}">Approve</button><button class="ghost tno" data-id="${t.id}">Deny</button></div></div>`).join("") +
      (tl.active.map(t => `<div class="card"><button class="x mytool" data-name="${esc(t.name)}" title="Switch off">✕</button><b>🧩 ${esc(t.name)}</b><small>${esc(t.description)}</small></div>`).join("") || (tl.pending.length ? "" : `<small>Abilities Kakarot builds for itself appear here.</small>`)) +
      `<div class="sec">Coding</div><div class="card"><b>Projects folder</b><small>${esc(su.code_folder)}</small></div>` +
      `<div class="sec">Lal Sobuj morning brief</div><div class="card"><b>${b.enabled ? `Every day at ${esc(b.time)}` : "Turned off"}</b><small>last: ${esc(b.last || "never")} · next: ${esc(st.next["sys-brief"] || "-")}${b.running ? " · running now…" : ""}</small><div class="mini"><button class="ghost" id="brief">Run brief now</button></div></div>`;
    s.querySelectorAll(".x[data-url]").forEach(x => x.onclick = async () => { await api("/api/sites/remove", {method:"POST", body:JSON.stringify({url:x.dataset.url})}); renderSide(); });
    $("#addsite").onclick = async () => { const u = $("#site").value.trim(); if(!u) return; $("#addsite").disabled = true; await api("/api/sites", {method:"POST", body:JSON.stringify({url:u})}); renderSide(); };
    $("#checksites").onclick = async () => { $("#checksites").textContent = "Checking…"; await api("/api/sites/check", {method:"POST"}); renderSide(); };
    $("#reindex").onclick = async () => { await api("/api/index", {method:"POST"}); $("#reindex").textContent = "Indexing… (refresh in a minute)"; };
    $("#upd").onclick = async () => { $("#upd").textContent = "Checking…"; const r = await api("/api/selfupdate/check", {method:"POST", body:"{}"}); $("#upd").textContent = r.message; };
    $("#learn").onclick = async () => { const r = await api("/api/selfupdate/learn", {method:"POST"}); $("#learn").textContent = r.message; };
    s.querySelectorAll(".lesson").forEach(x => x.onclick = async () => { await api("/api/lessons/" + x.dataset.id, {method:"DELETE"}); renderSide(); });
    s.querySelectorAll(".mytool").forEach(x => x.onclick = async () => { if(!confirm("Switch off this ability?")) return; await api(`/api/mytools/${x.dataset.name}/remove`, {method:"POST"}); renderSide(); });
    s.querySelectorAll(".tok,.tno").forEach(x => x.onclick = async () => { x.disabled = true; await api("/api/approvals/" + x.dataset.id, {method:"POST", body:JSON.stringify({approve: x.classList.contains("tok")})}); renderSide(); });
    $("#brief").onclick = async () => { const r = await api("/api/brief", {method:"POST"}); $("#brief").textContent = r.message; };
  } else {
    const mem = await api("/api/memory");
    s.innerHTML = mem.map(m => `<div class="card"><button class="x" data-id="${m.id}" title="Forget">✕</button>${esc(m.fact)}</div>`).join("") || `<small>Things Kakarot remembers about you appear here.</small>`;
    s.querySelectorAll(".x").forEach(b => b.onclick = async () => { await api("/api/memory/" + b.dataset.id, {method:"DELETE"}); renderSide(); });
  }
}


// ---------------------------------------------------------------- Websites tab
const scoreCls = n => n == null ? "" : n >= 85 ? "g" : n >= 60 ? "y" : "r";
const ORIGIN = o => ({github: `GitHub ${o.owner}/${o.repo}`, ftp: `hosting ${o.account || ""}`, folder: "folder on this PC", url: "copy of live pages", built: "built by Kakarot"})[o?.type] || "built by Kakarot";
const SEV = {high: "🔴", medium: "🟠", low: "🟡"};
async function renderWebsites(s){
  const [webs, accs, aps] = await Promise.all([api("/api/websites"), api("/api/accounts"), api("/api/approvals")]);
  const ftps = accs.filter(a => a.kind === "ftp");
  const keep = {src: s.querySelector("#wsrc")?.value || "", acc: s.querySelector("#wacc")?.value || ""};
  const pend = aps.filter(a => a.kind === "publish");
  s.innerHTML = `<div class="card"><b>Open an existing website</b><small>A live address (yoursite.com), a GitHub repo (owner/repo), or a folder on this PC. Kakarot copies it and checks everything. With your hosting's FTP account saved, it works on the REAL files.</small>
    <div class="mini"><input id="wsrc" placeholder="lalsobujdata.site · github.com/me/site · C:\\Users\\me\\site"></div>
    <div class="mini">${ftps.length ? `<select id="wacc"><option value="">From the address (auto)</option>${ftps.map(a => `<option value="${esc(a.key)}">Hosting: ${esc(a.label)}</option>`).join("")}</select>` : ""}<button class="btn" id="wopen">Open & check</button></div><div class="msgline" id="wmsg"></div></div>` +
    (pend.length ? `<div class="sec">Waiting for your OK</div>` + pend.map(a => { const t = JSON.parse(a.detail); return `<div class="card approve" style="margin:0 0 10px">${publishCard(t, a.reason).replace('class="yes"', `class="yes" data-ap="${a.id}"`).replace('class="no"', `class="no" data-ap="${a.id}"`)}</div>`; }).join("") : "") +
    `<div class="sec">Your websites</div>` + (webs.map(w => { const lc = w.last_check;
      return `<div class="card"><b>🌐 ${esc(w.title)} ${lc ? `<span class="pill ${scoreCls(lc.score)}">${lc.score}</span>` : ""}</b><small>${esc(w.kind)} · ${esc(ORIGIN(w.origin))}${lc ? " · checked " + esc(lc.at.slice(0, 16)) : ""}</small>${w.live ? `<br><small>🌍 <a href="${esc(w.live)}" target="_blank" rel="noopener">${esc(w.live)}</a></small>` : ""}${w.busy ? `<br><small>⚙️ working on it (Mission #${w.busy})…</small>` : ""}${w.pending.length ? `<br><small>🚀 publish waiting for your OK</small>` : ""}
        <div class="wrap"><a class="ghost" href="${esc(w.link)}" target="_blank">Preview</a><button class="btn" data-site="${esc(w.name)}">Manage</button></div></div>`; }).join("") || `<small>No websites yet. Open one above, or build a new one in Missions.</small>`) +
    `<div class="sec">Publishing accounts</div>` + accountsHTML(accs);
  $("#wsrc").value = keep.src; if($("#wacc")) $("#wacc").value = keep.acc;
  $("#wopen").onclick = async () => { const src = $("#wsrc").value.trim(), acc = $("#wacc")?.value || ""; if(!src && !acc){ $("#wsrc").focus(); return; }
    $("#wopen").disabled = true; const r = await api("/api/websites/open", {method:"POST", body:JSON.stringify({source:src, account:acc})}); $("#wmsg").textContent = r.error || r.message; $("#wopen").disabled = false; if(!r.error){ $("#wsrc").value = ""; setTimeout(renderSide, 1500); } };
  s.querySelectorAll("[data-site]").forEach(b => b.onclick = () => openSite(b.dataset.site));
  s.querySelectorAll("[data-ap]").forEach(b => b.onclick = async () => { b.disabled = true; await api("/api/approvals/" + b.dataset.ap, {method:"POST", body:JSON.stringify({approve: b.classList.contains("yes")})}); renderSide(); });
  wireAccounts(s);
}
function accountsHTML(accs){
  const has = k => accs.find(a => a.key === k);
  const row = a => `<div class="hist"><div><b>${a.kind === "ftp" ? "🖥 " + esc(a.label) : a.kind === "github" ? "🐙 GitHub" : a.kind === "netlify" ? "🟩 Netlify" : "▲ Vercel"}</b><small>${a.kind === "ftp" ? `${esc(a.user)} @ ${esc(a.host)}:${a.port} → ${esc(a.folder)}${a.site_url ? " · " + esc(a.site_url) : ""} · ${a.secure ? "secure FTPS" : "plain FTP"}` : "token " + esc(Object.values(a.hint || {})[0] || "")}</small><small class="tres" data-k="${esc(a.key)}"></small></div><button class="ghost" data-test="${esc(a.key)}">Test</button><button class="ghost" data-del="${esc(a.key)}">✕</button></div>`;
  return `<div class="card">${accs.map(row).join("") || "<small>Nothing saved yet. Passwords and tokens stay on this PC, locked with your Windows login, and are never shown to the AI.</small>"}
    <details><summary>➕ Hosting (FTP / cPanel, e.g. Namecheap)</summary><small>cPanel → FTP Accounts shows the server, user name and port. The folder is usually public_html.</small><div class="form">
      <input id="f_label" placeholder="Name (e.g. lalsobuj)"><input id="f_site" placeholder="Website address (lalsobujdata.site)">
      <input id="f_host" placeholder="FTP server (ftp.yoursite.com)"><input id="f_port" placeholder="Port" value="21">
      <input id="f_user" placeholder="User (name@yoursite.com)"><input id="f_pass" type="password" placeholder="Password" autocomplete="new-password">
      <input id="f_folder" placeholder="Folder" value="public_html"><span></span>
      <label><input type="checkbox" id="f_secure" checked> Secure (FTPS)</label><label><input type="checkbox" id="f_verify" checked> Check certificate</label>
      <label class="full"><input type="checkbox" id="f_plain"> Allow plain FTP if secure fails (not recommended)</label>
      <button class="btn full" id="f_save">Save hosting</button></div></details>
    <details><summary>${has("github") ? "✏️ Change" : "➕ Add"} GitHub token</summary><small>github.com → Settings → Developer settings → Fine-grained tokens → give it your repositories with Contents: Read and write (+ Administration to create repos, Pages for GitHub Pages).</small><div class="form"><input id="g_tok" class="full" type="password" placeholder="github_pat_… or ghp_…" autocomplete="off"><button class="btn full" data-save="github">Save GitHub</button></div></details>
    <details><summary>${has("netlify") ? "✏️ Change" : "➕ Add"} Netlify token</summary><small>app.netlify.com → User settings → Applications → Personal access tokens.</small><div class="form"><input id="n_tok" class="full" type="password" placeholder="Netlify token" autocomplete="off"><button class="btn full" data-save="netlify">Save Netlify</button></div></details>
    <details><summary>${has("vercel") ? "✏️ Change" : "➕ Add"} Vercel token</summary><small>vercel.com → Account Settings → Tokens. Team id only if the project is in a team.</small><div class="form"><input id="v_tok" type="password" placeholder="Vercel token" autocomplete="off"><input id="v_team" placeholder="Team id (optional)"><button class="btn full" data-save="vercel">Save Vercel</button></div></details>
    <div class="msgline" id="amsg"></div></div>`;
}
function wireAccounts(s){
  const say = t => { $("#amsg").textContent = t; };
  s.querySelectorAll("[data-test]").forEach(b => b.onclick = async () => { const out = s.querySelector(`.tres[data-k="${b.dataset.test}"]`); out.textContent = "Testing…"; const r = await api(`/api/accounts/${b.dataset.test}/test`, {method:"POST"}); out.textContent = r.error ? "❌ " + r.error : r.message; });
  s.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if(!confirm("Remove this account from Kakarot?")) return; await api("/api/accounts/" + b.dataset.del, {method:"DELETE"}); renderSide(); });
  $("#f_save").onclick = async () => { const v = id => $("#" + id).value.trim();
    const r = await api("/api/accounts", {method:"POST", body:JSON.stringify({kind:"ftp", label:v("f_label") || v("f_site") || v("f_host"), site_url:v("f_site"), host:v("f_host"), port:+v("f_port") || 21, user:v("f_user"), password:$("#f_pass").value, folder:v("f_folder"), secure:$("#f_secure").checked, verify_cert:$("#f_verify").checked, allow_plain:$("#f_plain").checked})});
    if(r.error) return say("❌ " + r.error); say("Saved. Testing the connection…"); const t = await api(`/api/accounts/${r.key}/test`, {method:"POST"}); say(t.error ? "Saved, but the test failed: " + t.error : t.message); setTimeout(renderSide, 2500); };
  s.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => { const k = b.dataset.save, tok = $("#" + k[0] + "_tok").value.trim(); if(!tok) return say("Paste the token first.");
    const body = {kind:k, token:tok}; if(k === "vercel") body.team = $("#v_team").value.trim();
    const r = await api("/api/accounts", {method:"POST", body:JSON.stringify(body)}); if(r.error) return say("❌ " + r.error);
    const t = await api(`/api/accounts/${k}/test`, {method:"POST"}); say(t.error ? "Saved, but: " + t.error : t.message); setTimeout(renderSide, 2500); });
}

let siteOpen = null, siteTimer = null;
function closeSite(){ siteOpen = null; clearInterval(siteTimer); $("#modal").classList.remove("on"); }
$("#modal").onclick = e => { if(e.target.id === "modal") closeSite(); };
async function openSite(name, keepMsg){
  siteOpen = name; clearInterval(siteTimer);
  const [d, tg] = await Promise.all([api("/api/websites/" + encodeURIComponent(name)), api("/api/publish-targets/" + encodeURIComponent(name))]);
  if(d.error){ alert(d.error); return; }
  const sp = d.spec, r = d.report, o = sp.origin || {}, msg = keepMsg ?? ($("#smsg")?.textContent || "");
  const changeDraft = $("#schange")?.value || "";
  const live = sp.live_url, gh = (sp.publish || {}).github;
  const issues = r ? r.issues : [];
  const lastUndoable = d.history.find(h => !h.undone);
  const lastPub = d.deploys.find(x => !x.undo_of && !x.note && x.target);
  $("#mbox").innerHTML = `<div class="top"><div><h2>${esc(sp.title)}</h2><small>${esc(d.kind)} · ${esc(ORIGIN(o.type ? o : {type:"built"}))} · ${d.files} files</small></div><button class="x" title="Close">✕</button></div>
    <div class="wrap"><a class="btn" href="${esc(d.link)}" target="_blank">▶ Preview</a>${live ? `<a class="ghost" href="${esc(live)}" target="_blank" rel="noopener">🌍 Live site</a>` : ""}${gh ? `<a class="ghost" href="https://github.com/${esc(gh.repo)}" target="_blank" rel="noopener">📦 Code on GitHub</a>` : ""}</div>
    ${d.busy ? `<div class="msgline">⚙️ Working on it (Mission #${d.busy}) - this page updates by itself.</div>` : ""}
    ${(sp.notes || []).map(n => `<div class="msgline">ℹ️ ${esc(n)}</div>`).join("")}
    <h3>Do something</h3>
    <div class="wrap"><button class="btn" data-act="check">🔍 Check now</button>${live ? `<button class="ghost" data-act="checklive">🔍 Check the live site</button>` : ""}<button class="btn" data-act="fix">🛠 Fix problems</button>${(o.type === "github" || o.type === "ftp" || gh) ? `<button class="ghost" data-act="refresh">🔄 Get latest from ${o.type === "ftp" ? "hosting" : "GitHub"}</button>` : ""}</div>
    <div class="mini"><textarea id="schange" placeholder="What should I change? e.g. Add a prices page with Dhaka-Sylhet 800 Tk, make the header green, fix the contact form…"></textarea></div>
    <div class="wrap"><button class="btn" data-act="change">✏️ Make this change</button></div>
    <h3>Publish</h3>
    ${tg.targets && tg.targets.length ? `<div class="mini"><select id="starget">${tg.targets.map(t => `<option value="${esc(t.value)}" ${t.value === tg.default ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select><button class="btn" data-act="publish">🚀 Publish…</button></div>
      <div class="mini" id="sghopts"><input id="srepo" placeholder="GitHub repo owner/name (optional)" value="${esc(gh ? gh.repo : "")}"><input id="sbranch" placeholder="branch (optional)" style="max-width:130px"></div>
      <small>Only changed files are sent. You approve first; server files are backed up so you can undo.</small>` : `<small>Add GitHub, your hosting (FTP) or Netlify/Vercel under Publishing accounts (Websites tab) to publish.</small>`}
    <div class="msgline" id="smsg"></div>
    <h3>Check report ${r ? `<span class="pill ${scoreCls(r.score)}">${r.score}/100</span> <small>${esc(r.at)} · ${esc(r.where || "")} · ${r.pages} page(s)</small>` : ""}</h3>
    ${r ? `<div class="scores">${Object.entries(r.scores).map(([a, v]) => `<div>${esc(a)} <span>${v}</span><div class="bar"><i style="width:${v}%;background:${v >= 85 ? "#2f9e5f" : v >= 60 ? "#c99a12" : "var(--warn)"}"></i></div></div>`).join("")}</div>
      ${r.facts?.not_run ? `<div class="msgline">⚠️ ${esc(r.facts.not_run)}</div>` : ""}
      <div class="shots"><img src="/api/websites/${encodeURIComponent(name)}/shot/desktop?${Date.now()}" onerror="this.remove()" alt="Desktop view"><img src="/api/websites/${encodeURIComponent(name)}/shot/phone?${Date.now()}" onerror="this.remove()" alt="Phone view"></div>
      <div style="margin-top:8px">${issues.map(i => `<div class="iss">${SEV[i.sev]} <b style="display:inline">${esc(i.title)}</b> <span class="tag">${esc(i.area)}</span>${i.fix === "manual" ? `<span class="tag">needs you</span>` : i.fix === "auto" ? `<span class="tag">auto-fix</span>` : ""}<small>${i.file ? `<code>${esc(i.file)}</code> ` : ""}${i.pages.length ? "on " + esc(i.pages.slice(0, 4).join(", ")) : ""}${i.hint ? " · " + esc(i.hint) : ""}</small></div>`).join("") || "<small>✅ No problems found.</small>"}</div>` : `<small>Not checked yet - tap Check now.</small>`}
    <h3>History</h3>
    ${d.history.map(h => `<div class="hist"><div><b>${esc(h.label)}</b>${h.undone ? ' <span class="tag">undone</span>' : ""}<small>${esc(h.at)} · ${h.files.map(f => esc(f.path) + (f.binary ? "" : ` (+${f.added} −${f.removed})`)).slice(0, 6).join(", ")}${h.score_before != null ? ` · score ${h.score_before}→${h.score_after}` : ""}</small><pre class="diff" id="df_${esc(h.id)}" style="display:none"></pre></div><button class="ghost" data-diff="${esc(h.id)}">Diff</button>${lastUndoable && h.id === lastUndoable.id ? `<button class="ghost" data-undo="${esc(h.id)}">Undo</button>` : ""}</div>`).join("") || "<small>No changes yet.</small>"}
    ${d.deploys.length ? `<h3>Publishes</h3>` + d.deploys.map(x => `<div class="hist"><div><b>${x.undo_of ? "↩️ Undo" : "🚀"} ${esc(x.target)} → ${esc(x.dest || "")}</b><small>${esc(x.at)} · ${x.note ? esc(x.note) : x.summary ? esc(x.summary) : (x.uploaded || []).length + " file(s)"}${x.live_url ? ` · <a href="${esc(x.live_url)}" target="_blank" rel="noopener">live</a>` : ""}</small></div>${lastPub && x.id === lastPub.id && x.target !== "vercel" ? `<button class="ghost" data-unpub="${esc(x.id)}">Undo</button>` : ""}</div>`).join("") : ""}`;
  $("#modal").classList.add("on");
  $("#smsg").textContent = msg; $("#schange").value = changeDraft;
  const say = t => { $("#smsg").textContent = t; };
  const ghBox = () => { const t = $("#starget")?.value || ""; if($("#sghopts")) $("#sghopts").style.display = t.startsWith("github") ? "flex" : "none"; };
  if($("#starget")){ $("#starget").onchange = ghBox; ghBox(); }
  $("#mbox .x").onclick = closeSite;
  const act = async (a, body) => { say("…"); const r = await api(`/api/websites/${encodeURIComponent(name)}/${a}`, {method:"POST", body:JSON.stringify(body || {})}); say(r.error ? "❌ " + r.error : r.message); if(!r.error && a !== "undo") setTimeout(() => siteOpen === name && openSite(name, r.message), 1200); return r; };
  $("#mbox").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if(a === "check") return act("check", {});
    if(a === "checklive") return act("check", {live:true});
    if(a === "fix") return act("fix", {});
    if(a === "refresh") return act("refresh", {});
    if(a === "change"){ const c = $("#schange").value.trim(); if(!c) return $("#schange").focus(); const r = await act("change", {change:c}); if(!r.error) $("#schange").value = ""; return; }
    if(a === "publish"){ const t = $("#starget").value; const r = await act("publish", {target:t, repo:t.startsWith("github") ? $("#srepo").value.trim() : "", branch:t.startsWith("github") ? $("#sbranch").value.trim() : "", pages:t === "github-pages"}); if(!r.error) checkApprovals(true); }
  });
  $("#mbox").querySelectorAll("[data-diff]").forEach(b => b.onclick = async () => { const el = $("#df_" + b.dataset.diff); if(el.style.display === "block"){ el.style.display = "none"; return; } el.textContent = "loading…"; el.style.display = "block"; const r = await fetch(`/api/websites/${encodeURIComponent(name)}/diff/${b.dataset.diff}`); el.textContent = await r.text(); });
  $("#mbox").querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => { if(!confirm("Undo this change? (You can undo the undo too.)")) return; const r = await act("undo", {what:"change", id:b.dataset.undo}); openSite(name, r.error ? "❌ " + r.error : r.message); });
  $("#mbox").querySelectorAll("[data-unpub]").forEach(b => b.onclick = async () => { const r = await act("undo", {what:"publish", id:b.dataset.unpub}); if(!r.error) checkApprovals(true); });
  if(d.busy) siteTimer = setInterval(() => { if(siteOpen === name && !document.activeElement?.closest?.("#mbox")) openSite(name); }, 6000);
}

async function poll(){
  try{
    const items = await api("/api/inbox");
    const unseen = items.filter(i => !i.seen);
    const bh = unseen.length ? `<span class="badge">${unseen.length}</span>` : "";
    if(tab !== "inbox") $("#badge").innerHTML = bh;
    $("#badge2").innerHTML = document.body.classList.contains("open") ? "" : bh;
    if(lastInbox !== null && items.length && items[0].id > lastInbox){
      document.title = "● Kakarot";
      if(window.Notification && Notification.permission === "granted") new Notification(items[0].title, {body: items[0].body.slice(0,200)});
      if(tab === "inbox") renderSide();
    }
    lastInbox = items.length ? items[0].id : 0;
    const aps = await api("/api/approvals"); const nt = aps.filter(x => x.kind === "tool").length;
    $("#badge3").innerHTML = nt ? `<span class="badge">${nt}</span>` : "";
    const np = aps.filter(x => x.kind === "publish").length;
    $("#badge4").innerHTML = np ? `<span class="badge">${np}</span>` : "";
    if(np) checkApprovals(true);
  }catch(e){}
}
window.addEventListener("focus", () => document.title = "Kakarot");

(async function init(){
  const st = await api("/api/status").catch(() => null);
  if(st){
    $("#name").textContent = st.name;
    $("#status").textContent = st.model_ready ? `● ${st.model} ready` : st.hint;
    if(!st.smart_ready) $("#smart").title = `Smart mode needs ${st.smart_model}: run get-smart-brain.bat once`;
    $("#status").className = st.model_ready ? "" : "bad";
  }
  const last = store.get("kakarot_conv");
  if(last) await openChat(+last); else showEmpty();
  renderSide(); poll(); setInterval(poll, 15000);
  setInterval(() => { if((tab === "missions" || tab === "websites") && !document.activeElement?.closest?.("#side")) renderSide(); }, 6000);
  if(window.Notification && Notification.permission === "default") Notification.requestPermission();
})();
</script>
</body>
